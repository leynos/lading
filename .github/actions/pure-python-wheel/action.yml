name: Build Pure Python Wheel and Sdist
description: >-
  Builds the source distribution and, from it, the pure Python wheel using uv,
  then uploads both as an artefact.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory to place the built sdist and wheel
    required: false
    default: dist
  artifact-name:
    description: Name of the uploaded artifact
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
    - name: Build sdist and wheel
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        # Plain `uv build` builds the sdist first, then the wheel from it.
        uv build --out-dir "${OUT_DIR}"
    - name: Check build outputs
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        sdists=("${OUT_DIR}"/*.tar.gz)
        wheels=("${OUT_DIR}"/*.whl)
        if [ "${#sdists[@]}" -ne 1 ]; then
          echo "Expected exactly one source distribution." >&2
          ls -al "${OUT_DIR}" >&2 || true
          exit 1
        fi
        if [ "${#wheels[@]}" -lt 1 ]; then
          echo "Expected at least one wheel." >&2
          ls -al "${OUT_DIR}" >&2 || true
          exit 1
        fi
    - name: Upload sdist and wheel artefact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.out-dir }}/*.whl
          ${{ inputs.out-dir }}/*.tar.gz
        if-no-files-found: error
