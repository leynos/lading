name: Coverage (main)

# This workflow is the repository's only CodeScene caller. Pull requests
# run the lint-test suite in ci.yml and never receive the token, never
# invoke `cs-coverage` and never upload: CodeScene accepts an upload only
# for analysed branches, and the changed-line gate that used to run there
# is gone.
#
# NOTE: coverage generation uses the pre-existing bespoke slipcover
# invocation, not the shared generate-coverage action. lading's root
# Cargo.toml is a committed fixture for its own workspace-release test
# scenarios (see docs/repository-layout.md), not a buildable crate; the
# shared action's language auto-detection has no override and always
# treats a root Cargo.toml as Rust (or "mixed" alongside pyproject.toml),
# so it tries `cargo llvm-cov nextest --workspace` against members that
# do not exist on disk and fails immediately. Moving to the shared action,
# and with it to its coverage ratchet, needs leynos/shared-actions#502;
# see the developer guide for what that branch carries and why the repin
# was tried here and reverted.

on:
  push:
    branches: [main]

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install code
        run: make build

      # --xml is required: without it slipcover's --out target is a
      # plain-text report, not Cobertura XML, which went unnoticed
      # while the CodeScene upload step was guarded by an unset secret
      # (confirmed by this workflow's first live run failing to parse
      # the uploaded coverage data).
      - name: Run tests with coverage
        run: |
          uv pip install slipcover pytest-forked
          uv run python -m slipcover \
            --source=./lading \
            --omit="*/.venv/*" \
            --branch \
            --xml \
            --out coverage.xml \
            -m pytest --forked -v

      # Repinned past f68e8e2e, which resolves the cs-coverage version from
      # a committed manifest rather than fetching the latest release. An
      # unpinned CLI is what broke Cobertura parsing across the estate on
      # 2026-09-16, and this step is the only place left to fix it.
      #
      # No checksum input is passed. `installer-checksum` is rejected when
      # non-empty, and its replacement `archive-checksum` checks the
      # manifest's archive digest, whereas the repository variable
      # get-codescene-sha.yml writes is the digest of the installer script
      # the action no longer uses. The manifest carries its own pin, so the
      # optional input is left out rather than fed a value that means
      # something else.
      - name: Upload coverage data to CodeScene
        if: env.CS_ACCESS_TOKEN
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
