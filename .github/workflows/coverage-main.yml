name: Coverage (main)

# This workflow is the repository's only CodeScene caller. Pull requests
# run the lint-test suite in ci.yml and never receive the token, never
# invoke `cs-coverage` and never upload: CodeScene accepts an upload only
# for analysed branches, and the changed-line gate that used to run there
# is gone.
#
# Main owns both persistent coverage outputs: the CodeScene upload below and
# the ratchet baseline the shared action advances. Caches saved on main are
# readable by every pull-request run, so the baseline written here is the one
# a pull request's ratchet compares against. The action's default
# `publish-baseline: auto` is what confines the advance to a push to
# `refs/heads/main`, which is this workflow's only trigger.
#
# The shared action is usable here because `language: python` skips its
# manifest-based detection. lading commits a synthetic root Cargo.toml as a
# fixture for its own workspace-release test scenarios (see
# docs/repository-layout.md); it names crates/ directories that do not exist
# on disk, so detection would run `cargo llvm-cov nextest --workspace`
# against them and fail immediately. `python-source` holds the metric to the
# package, exactly as the bespoke slipcover invocation did.

on:
  push:
    branches: [main]

# Two pushes to main in quick succession would otherwise race, both to upload
# to CodeScene and to advance the ratchet baseline in the Actions cache, and
# the later run could overtake the earlier one. Runs queue per ref rather than
# cancelling, because a cancelled run leaves main's coverage unpublished.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        # The same commit ci.yml pins, so the two workflows install the same
        # uv. A third-party action moves under a tag; the first-party
        # `actions/*` steps above stay on their major tag, as they do there.
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install code
        run: make build

      # Cobertura is the action's default format, and the upload step below
      # names it too. The bespoke invocation this replaced needed an explicit
      # `--xml`: without it slipcover's `--out` target was a plain-text
      # report, which went unnoticed while the upload step was guarded by an
      # unset secret, and was confirmed by this workflow's first live run
      # failing to parse the uploaded coverage data.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          output-path: coverage.xml
          python-source: ./lading
          with-ratchet: 'true'
          # `publish-artefact` is deliberately left unset, so the action keeps
          # its default and archives the report this lane uploads to
          # CodeScene. Setting it here, as the pull-request lane does, would
          # leave the run with no published report at all.

      # Repinned past f68e8e2e, which resolves the cs-coverage version from
      # a committed manifest rather than fetching the latest release. An
      # unpinned CLI is what broke Cobertura parsing across the estate on
      # 2026-09-16, and this step is the only place left to fix it.
      #
      # No checksum input is passed. `installer-checksum` is rejected when
      # non-empty, and `archive-checksum` only restates the manifest archive
      # digest the action already verifies. The optional inputs are left out,
      # so the manifest carries the only pin the caller needs.
      # The ref guard states the rule at the step that depends on it, rather
      # than leaving it implied by the trigger above. CodeScene accepts an
      # upload only for an analysed branch, so a later dispatch trigger or a
      # second branch must not be able to reach this step by accident.
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
