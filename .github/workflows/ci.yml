name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          # ty is not installed here: `make typecheck` runs it via
          # `uv tool run --from ty==$(TY_VERSION) ty`. TY_VERSION in the
          # Makefile is the sole ty version declaration; update it there.
          # Pin ruff to the version the Makefile invokes (RUFF_VERSION) so the
          # linter behaves identically across the uv tool, the synced
          # virtualenv, and developer PATH; bump both sites together.
          uv tool install ruff==0.16.0

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make
        # markdownlint`. Spelling stays in `make spelling` below.
        # Pinned to the commit v24.2.0 points at, not to the tag object.
        # 4580e161 is the annotated tag's own SHA: immutable, but not a
        # commit, so a checkout resolving it is resolving a different kind of
        # object than the pin is meant to name.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # NOTE: the shared generate-coverage action is not used here. Its
      # language auto-detection treats any repository-root Cargo.toml as
      # Rust (or "mixed" alongside pyproject.toml) with no override, and
      # lading commits a synthetic root Cargo.toml as a fixture for its
      # own workspace-release test scenarios (see
      # docs/repository-layout.md) — it references crates/ directories
      # that do not exist on disk. `cargo llvm-cov nextest --workspace`
      # therefore fails immediately in CI trying to resolve that
      # manifest. Coverage generation therefore stays on this bespoke
      # slipcover invocation. Moving it to the shared action needs
      # leynos/shared-actions#502, which adds the `python-source` scope
      # that keeps the metric on ./lading, and the fix prepending the
      # coverage environment's scripts directory to PATH, without which
      # the cmd-mox tests cannot find the executables they create. That
      # repin was tried on this branch and reverted; see the developer
      # guide. Adds --xml: without it slipcover's --out target is a
      # plain-text report, not Cobertura XML, which went unnoticed
      # while the CodeScene upload step was guarded by an unset secret.
      - name: Run tests with coverage
        run: |
          uv pip install slipcover pytest-forked
          uv run python -m slipcover \
            --source=./lading \
            --omit="*/.venv/*" \
            --branch \
            --xml \
            --out coverage.xml \
            -m pytest --forked -v

      # The only publisher of this file in this workflow. The CodeScene
      # gate that used to upload a second copy under the name "coverage"
      # has gone; coverage-main.yml owns every upload now.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
