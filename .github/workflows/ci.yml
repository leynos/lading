name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          # ty is not installed here: `make typecheck` runs it via
          # `uv tool run --from ty==$(TY_VERSION) ty`. TY_VERSION in the
          # Makefile is the sole ty version declaration; update it there.
          # Pin ruff to the version the Makefile invokes (RUFF_VERSION) so the
          # linter behaves identically across the uv tool, the synced
          # virtualenv, and developer PATH; bump both sites together.
          uv tool install ruff==0.16.0

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make
        # markdownlint`. Spelling stays in `make spelling` below.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # The root Cargo.toml is a fixture, not a buildable workspace. Force
      # Python so the shared action skips Cargo auto-detection while retaining
      # its main-written coverage ratchet.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@ac272c8273c5baa53a26b4ac96b8ede3e86b7f94
        with:
          language: python
          python-source: ./lading
          output-path: coverage.xml
          format: cobertura
          pytest-workers: ''
          with-ratchet: 'true'

      # Keep the project-specific artefact for pull-request inspection. The
      # shared generator also archives its own coverage report.
      - name: Upload coverage artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
