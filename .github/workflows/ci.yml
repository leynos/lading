name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      # The pinned nose duplication detector. Bump alongside NOSE_VERSION in
      # the Makefile and [tool.nose].version in pyproject.toml;
      # tests/workflow_contracts/test_duplication_toolchain_contract.py fails
      # on drift between the three.
      NOSE_VERSION: "0.20.0"
      # cargo-binstall is the trusted prebuilt installer for the detector. The
      # digest is the published release artefact for this exact version and
      # target triple, verified with `sha256sum -c` before it is unpacked.
      BINSTALL_VERSION: "v1.22.0"
      BINSTALL_SHA256: "df2921254924066627685ee09f6c8b9acd7acef68a338668f879d2b033c09458"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release rather than a from-source build:
        # the action's pinned table and the release's own sidecar must agree.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ebe2f3105334283441f4c915eb979a0f4b9f2c04

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          # ty is not installed here: `make typecheck` runs it via
          # `uv tool run --from ty==$(TY_VERSION) ty`. TY_VERSION in the
          # Makefile is the sole ty version declaration; update it there.
          # Pin ruff to the version the Makefile invokes (RUFF_VERSION) so the
          # linter behaves identically across the uv tool, the synced
          # virtualenv, and developer PATH; bump both sites together.
          uv tool install ruff==0.16.0

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          version: "0.6.1"

      - name: Validate Makefile
        run: mbake validate Makefile

      # The Makefile scopes uv to repo-local cache and tool directories, so
      # caching them preserves the duplication gate's script environment (its
      # PEP 723 cyclopts/tomlkit resolution) and the Skylos tool environment
      # between runs. The Makefile and the gate scripts pin those versions, so
      # they key the cache alongside the project lockfile.
      - name: Cache uv tool and script environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .uv-cache
            .uv-tools
          key: uv-envs-${{ runner.os }}-${{ hashFiles('uv.lock', 'Makefile', 'scripts/*.py') }}
          restore-keys: |
            uv-envs-${{ runner.os }}-

      # cargo-binstall clones the nose repository before it downloads the
      # release artefact, so cache the installed binary and skip the whole
      # install on a hit. The key carries the pinned version, so a bump misses
      # the cache and reinstalls. `make install-nose` performs the same
      # version check, so a developer machine and CI converge on one binary.
      - name: Cache the pinned nose duplication detector
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/nose
          key: nose-${{ runner.os }}-${{ env.NOSE_VERSION }}

      # Deliberately not `make install-nose`: the Makefile target expects
      # cargo-binstall on PATH, and installing it from an unverified source is
      # what this step exists to avoid. The download is digested before it is
      # unpacked, and the detector is installed from the pinned upstream repo
      # with source compilation disabled, so a missing trusted release is a
      # provisioning failure rather than a silent source build.
      - name: Install nose duplication detector
        run: |
          if [ "$(.tools/nose/nose --version 2>/dev/null)" = "nose ${NOSE_VERSION}" ]; then
            echo "nose ${NOSE_VERSION} restored from cache"
            exit 0
          fi
          binstall_archive="$(mktemp)"
          binstall_directory="$(mktemp -d)"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$binstall_archive" \
            "https://github.com/cargo-bins/cargo-binstall/releases/download/${BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-musl.tgz"
          echo "${BINSTALL_SHA256}  ${binstall_archive}" | sha256sum -c -
          tar -xzf "$binstall_archive" -C "$binstall_directory"
          mkdir -p .tools/nose
          "$binstall_directory/cargo-binstall" --no-confirm --install-path .tools/nose \
            --disable-strategies compile,quick-install \
            --git https://github.com/corca-ai/nose "nose-cli@${NOSE_VERSION}"
          .tools/nose/nose --version

      - name: Run duplication gate tests
        run: make duplication-test

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make
        # markdownlint`. Spelling stays in `make spelling` below.
        # Pinned to the commit v24.2.0 points at, not to the tag object.
        # 4580e161 is the annotated tag's own SHA: immutable, but not a
        # commit, so a checkout resolving it is resolving a different kind of
        # object than the pin is meant to name.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run linters, including Skylos dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # `language: python` is what makes the shared action usable here.
      # lading commits a synthetic root Cargo.toml as a fixture for its own
      # workspace-release test scenarios (see docs/repository-layout.md); it
      # names crates/ directories that do not exist on disk, so the action's
      # manifest-based detection would run `cargo llvm-cov nextest
      # --workspace` against them and fail immediately. Forcing the scope
      # skips the Rust path entirely.
      #
      # `python-source` reproduces the scope the bespoke slipcover invocation
      # carried, keeping the metric on the package rather than widening it to
      # tests and fixtures. It also makes the old `--omit="*/.venv/*"`
      # redundant: scoped to ./lading, both invocations report the same 58
      # files at the same rates, which is why the ratchet baseline does not
      # move on adoption. The `--forked` the old invocation used is gone with
      # it; nothing in the suite depends on forking, and `make test` has
      # always run plain pytest.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@2a910bfcfd1ea4216419f9290331785f05b33320
        with:
          language: python
          output-path: coverage.xml
          python-source: ./lading
          # Pull requests compare against the baseline coverage-main.yml
          # writes. Pushes still generate and upload the artefact, but must
          # not become a second writer in the shared baseline cache family.
          with-ratchet: ${{ github.event_name == 'pull_request' }}
          # This lane measures and compares; it does not publish. The action
          # archives the report under a step of its own, which no scanner over
          # this file's steps can see, so declining that archive is the only
          # way the boundary is observable here. The report stays on the
          # runner for the upload step below.
          publish-artefact: 'false'

      # The only publisher of this file in this workflow, and the only one
      # that can be: the coverage action above declines its own archive. The
      # CodeScene gate that used to upload a second copy under the name
      # "coverage" has gone; coverage-main.yml owns every upload now.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
