name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          # ty is not installed here: `make typecheck` runs it via
          # `uv tool run --from ty==$(TY_VERSION) ty`. TY_VERSION in the
          # Makefile is the sole ty version declaration; update it there.
          # Pin ruff to the version the Makefile invokes (RUFF_VERSION) so the
          # linter behaves identically across the uv tool, the synced
          # virtualenv, and developer PATH; bump both sites together.
          uv tool install ruff==0.16.0

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make
        # markdownlint`. Spelling stays in `make spelling` below.
        # Pinned to the commit v24.2.0 points at, not to the tag object.
        # 4580e161 is the annotated tag's own SHA: immutable, but not a
        # commit, so a checkout resolving it is resolving a different kind of
        # object than the pin is meant to name.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # `language: python` is what makes the shared action usable here.
      # lading commits a synthetic root Cargo.toml as a fixture for its own
      # workspace-release test scenarios (see docs/repository-layout.md); it
      # names crates/ directories that do not exist on disk, so the action's
      # manifest-based detection would run `cargo llvm-cov nextest
      # --workspace` against them and fail immediately. Forcing the scope
      # skips the Rust path entirely.
      #
      # `python-source` reproduces the scope the bespoke slipcover invocation
      # carried, keeping the metric on the package rather than widening it to
      # tests and fixtures. It also makes the old `--omit="*/.venv/*"`
      # redundant: scoped to ./lading, both invocations report the same 58
      # files at the same rates, which is why the ratchet baseline does not
      # move on adoption. The `--forked` the old invocation used is gone with
      # it; nothing in the suite depends on forking, and `make test` has
      # always run plain pytest.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          output-path: coverage.xml
          python-source: ./lading
          # Pull requests compare against the baseline coverage-main.yml
          # writes. Pushes still generate and upload the artefact, but must
          # not become a second writer in the shared baseline cache family.
          with-ratchet: ${{ github.event_name == 'pull_request' }}
          # This lane measures and compares; it does not publish. The action
          # archives the report under a step of its own, which no scanner over
          # this file's steps can see, so declining that archive is the only
          # way the boundary is observable here. The report stays on the
          # runner for the upload step below.
          publish-artefact: 'false'

      # The only publisher of this file in this workflow, and the only one
      # that can be: the coverage action above declines its own archive. The
      # CodeScene gate that used to upload a second copy under the name
      # "coverage" has gone; coverage-main.yml owns every upload now.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
