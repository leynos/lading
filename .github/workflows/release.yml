name: Release Distributions

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read


jobs:

  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.14'
          artifact-name: wheels-pure

  publish-pypi:
    needs:
      - build-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lading/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Collect release artefacts
        uses: ./.github/actions/collect-release-artefacts
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Skip distributions already published to PyPI
        run: python scripts/stage_release_distributions.py
        env:
          PYPI_INDEX_URL: https://pypi.org
      - name: Publish distributions to PyPI
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/publish/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No unpublished distributions remain; skipping PyPI upload."
            exit 0
          fi
          uv publish --trusted-publishing always --check-url "${PYPI_INDEX_URL}/simple/" "${files[@]}"
        env:
          PYPI_INDEX_URL: https://pypi.org

  release:
    needs:
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Collect release artefacts
        uses: ./.github/actions/collect-release-artefacts
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Create draft release if absent
        run: |
          set -euo pipefail
          status=0
          gh_error=$(gh release view "$TAG" 2>&1) || status=$?
          if (( status == 0 )); then
            echo "::notice::Release ${TAG} already exists; reusing it."
          else
            if [[ "${gh_error}" == *"release not found"* ]]; then
              gh release create "$TAG" --draft --generate-notes
            else
              echo "::error::Could not inspect release ${TAG}: ${gh_error}" >&2
              exit "${status}"
            fi
          fi
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload distributions to GitHub release
        run: uv run --locked --script scripts/upload_release_wheels.py --tag "$TAG" --directory dist/publish
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release
        run: gh release edit "$TAG" --draft=false
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
