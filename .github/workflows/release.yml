name: Release Wheels

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write


jobs:

  pure-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure

  release:
    # This project has no C or Rust extensions, so cross-platform
    # builds are unnecessary. Only the pure Python wheel is published.
    needs:
      - pure-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v3.0.3
        # Created as a draft so that a failure between here and the upload
        # leaves nothing published: v0.3.0 and v0.3.1 were live with no wheel.
        with:
          draft: true
          generate_release_notes: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-pure
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Upload wheels to release
        # The wheel search and its empty case live in the script: a shell
        # pipeline reports the exit status of its last command, which is how
        # this step used to pass having uploaded nothing.
        run: uv run --script scripts/upload_release_wheels.py --directory dist
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        # Last step in the job: the release becomes visible only once its
        # wheel is attached.
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
