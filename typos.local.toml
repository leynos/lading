# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Inline code spans name real identifiers (for example
# `normalise_workspace_root`), which must keep their source spelling even where
# the prose policy prefers the -ize form. The shared authority used to supply
# this exclusion; pin it locally so regenerating typos.toml cannot drop it.
ignore = ["`[^`\\n]+`"]

[files]
# The standalone path's lockfile. The generated typos.toml excludes lockfiles
# by basename (uv.lock, Cargo.lock, ...) and this one is named for its script,
# so it is listed here instead. The exclusion is defensive rather than
# load-bearing today: the gate's scope reaches Markdown, so a hash in a
# lockfile is not currently scanned. It is declared so that a future widening
# of the scope does not have to re-discover these hashes.
exclude = ["scripts/upload_release_wheels.py.lock"]
